<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<style type="text/css">
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/inter-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('fonts/inter-latin-600-normal.woff2') format('woff2');
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: #ffffff; color: #5f6b80;
  }
  .wb-empty-icon {
    width: 76px; height: 76px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: #f4f6fa; border: 1px solid #e1e5ed;
    color: #cc151c;
  }
  .wb-empty-icon svg { width: 38px; height: 38px; }
  .wb-empty-title { font-weight: 600; font-size: 1.05rem; color: #172033; }
  .wb-empty-sub { font-size: .9rem; max-width: 320px; line-height: 1.5; }

  html.dark-mode body { background: #151e2d; color: #9caac0; }
  html.dark-mode .wb-empty-icon { background: #1a2638; border-color: #2b3950; color: #ff6b70; }
  html.dark-mode .wb-empty-title { color: #edf2fb; }
</style>
<script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) { document.documentElement.className += ' dark-mode'; }
  } catch (e) {}
</script>
</head>
<body>
  <div class="wb-empty-icon" aria-hidden="true" id="wb-ico"></div>
  <div class="wb-empty-title" id="wb-title">Nichts ausgew&auml;hlt</div>
  <div class="wb-empty-sub" id="wb-sub">W&auml;hlen Sie links einen Eintrag aus, um ihn hier anzuzeigen.</div>
  <script>
  (function () {
    var A = 'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"';
    var ICONS = {
      mail:    '<path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8" '+A+'/><path d="m3 8 8.4 5.6a2 2 0 0 0 2.2 0L22 8" '+A+'/><path d="M3 8 12 2l9 6" '+A+'/>',
      settings:'<circle cx="12" cy="12" r="3" '+A+'/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" '+A+'/>',
      contacts:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" '+A+'/><circle cx="9" cy="7" r="4" '+A+'/><path d="M22 21v-2a4 4 0 0 0-3-3.87" '+A+'/><path d="M16 3.13a4 4 0 0 1 0 7.75" '+A+'/>'
    };
    var TXT = {
      en: {
        mail:     ['No message selected', 'Select a message on the left to read it here.'],
        settings: ['No section selected', 'Select a settings section on the left.'],
        contacts: ['No contact selected', 'Select a contact on the left.']
      },
      de: {
        mail:     ['Keine Nachricht ausgewählt', 'Wählen Sie links eine Nachricht aus, um sie hier zu lesen.'],
        settings: ['Kein Bereich ausgewählt', 'Wählen Sie links einen Einstellungsbereich.'],
        contacts: ['Kein Kontakt ausgewählt', 'Wählen Sie links einen Kontakt aus.']
      }
    };
    var task = 'mail', lng = 'en';
    try {
      var env = window.parent && window.parent.rcmail && window.parent.rcmail.env;
      task = (env && env.task) || 'mail';
      lng = String((env && env.lang) || document.documentElement.lang || navigator.language || 'en').slice(0, 2).toLowerCase();
    } catch (e) {}
    var key = task === 'settings' ? 'settings' : (task === 'addressbook' ? 'contacts' : 'mail');
    var t = (TXT[lng] || TXT.en)[key];
    document.getElementById('wb-ico').innerHTML =
      '<svg viewBox="0 0 24 24">' + ICONS[key] + '</svg>';
    document.getElementById('wb-title').textContent = t[0];
    document.getElementById('wb-sub').textContent = t[1];
  })();
  </script>
</body>
</html>
