<roundcube:include file="includes/layout.html" />

<h1 class="voice"><roundcube:object name="productname" /> <roundcube:label name="login" /></h1>

<div id="layout-content" class="selected no-navbar" role="main">
	<div class="wb-login">
		<!-- Hero (dunkle Seiten-Navigation) -->
		<aside class="wb-login-hero">
			<roundcube:object name="logo" src="/images/logo-dark.svg" id="wb-hero-logo" alt="Logo" />
			<span class="wb-kicker"><roundcube:label name="wb_kicker" /></span>
			<h1><roundcube:label name="wb_welcome" /></h1>
			<p class="wb-lede"><roundcube:label name="wb_lede" /></p>
			<ul class="wb-benefits">
				<li><roundcube:label name="wb_benefit1" /></li>
				<li><roundcube:label name="wb_benefit2" /></li>
				<li><roundcube:label name="wb_benefit3" /></li>
			</ul>
			<div class="wb-hero-foot">
				<roundcube:object name="productname" condition="config:display_product_info &gt; 0" />
			</div>
		</aside>

		<!-- Card (Roundcube-Login-Formular) -->
		<div class="wb-login-card">
			<span class="wb-badge"><roundcube:label name="login" /></span>
			<div class="wb-welcome"><roundcube:label name="wb_signin" /></div>
			<p class="wb-welcome-sub"><roundcube:label name="wb_signin_sub" /></p>

			<roundcube:form id="login-form" name="login-form" method="post" class="propform">
			<roundcube:object name="loginform" form="login-form" size="40" submit=true class="form-control" />
				<div id="login-footer" role="contentinfo">
					<roundcube:object name="version" condition="config:display_product_info == 2" />
					<roundcube:if condition="config:support_url" />
						<a href="<roundcube:var name='config:support_url' />" target="_blank" rel="noopener" class="support-link"><roundcube:label name="support" /></a>
					<roundcube:endif />
					<roundcube:container name="loginfooter" id="login-footer" />
				</div>
			</form>

			<div class="wb-secure" role="note">
				<span aria-hidden="true">&#128274;</span> <roundcube:label name="wb_secure" />
			</div>
		</div>
	</div>
</div>

<noscript>
	<p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p>
</noscript>

<roundcube:include file="includes/footer.html" />
